<style>

  /* ===== 1 Floodlight ===== */

  .d3 .nav { background:#1d2340; color:#c9c2ae; font-family:Heebo; } .d3 .nav .a { color:#f0c75e; } .d3 .nav i { background:#2e3558; } .d3 .nav .a i { background:#f0c75e; }

  .d6 .item .t { font-weight:800; font-size:15px; } .d6 .item .s { font-size:12px; opacity:.75; }
  .d6 .nav { background:#1c2721; color:#9aa79f; } .d6 .nav .a { color:#ffe27a; } .d6 .nav i { background:#2d3c34; border-radius:50%; } .d6 .nav .a i { background:#ffe27a; }

  /* ===== 7 Analyst ===== */
  .d7 .screen { background:#f3f5f8; color:#0f1b2d; font-family: 'IBM Plex Sans Hebrew'; }
  .d7 .hd { padding: 44px 16px 8px; display:flex; justify-content:space-between; align-items:flex-end; }
  .d7 .hd .t { font-weight:700; font-size:22px; } .d7 .hd .s { font-size:12px; color:#5d6b82; }

  .d7 .nav { background:#fff; color:#8a97ad; border-top:1px solid #e6eaf1; } .d7 .nav .a { color:#2251ff; font-weight:700; } .d7 .nav i { background:#eef1f6; } .d7 .nav .a i { background:#2251ff; }

<body>
<header class="top">
  <h1>Football Academy · 8 כיווני עיצוב</h1>
  <p>אותו מסך בכל הכיוונים: מסך "היום" של יום ראשון 4/10, עונה שבוע 1. התוכן: אימון פלג גוף עליון בבוקר, מהירות לפני משחק השכונה של שלישי, ליבה אחרי, צ'ק-אין בוקר (POMS ושינה) ומד עומס. בחר מספר (או שילוב, למשל "צבעים של 1 עם המבנה של 4").</p>
</header>
<main class="grid" id="grid"></main>

<script>
const NAV = ['היום','שבוע','מעקב','בדיקות','עוד'];
const nav = () => `<div class="nav">${NAV.map((n,i)=>`<div class="${i===0?'a':''}"><i></i>${n}</div>`).join('')}</div>`;
const UNITS = [420, 0, 610, 380, 0, 920, 300];
const bars = (max=920) => `<div class="bars">${UNITS.map((u,i)=>`<div class="${u? (u===920?'on hi':'on'):''}" style="height:${Math.max(6,u/max*100)}%"></div>`).join('')}</div>`;

const WEEK = [['א','UP'],['ב','–'],['ג','⚽'],['ד','LO'],['ה','–'],['ו','IP'],['ש','★']];
const strip = (cls) => `<div class="wk ${cls}">${WEEK.map(([d,t],i)=>`<div class="${i===0?'now':''}"><span>${d}</span><b>${t}</b></div>`).join('')}</div>`;
const D = [];

D.push({ name:'Floodlight · זרקורים', desc:'שחור עמוק וירוק ניאון, אותיות צרות וגדולות כמו בחומר של Matchfit. אנרגטי, ספורטיבי, מצב כהה בלבד.', html:`
<div class="hd"><div class="kicker">IN-SEASON · WEEK 1/10</div><div class="big">יום <em>4</em><br>עליון + מהירות</div><div class="sub">יום ראשון · 4 באוקטובר</div></div>
<div class="game"><div>משחק הבא · שלישי 20:00<br><span style="color:#8d9a8a">מגרש נווה שאנן · קליל</span></div><b>2 ימים</b></div>
